   youtube: am22221

topics:
  - name: Global Grid Systems
    web_url: https://github.com/am2222/pydggrid
    image_url: https://github.com/am2222/pydggrid/blob/master/docs/L6kmP.jpg?raw=true

  - name: GIScience  
    web_url: https://scholar.google.com/citations?hl=en&user=QNGs_a4AAAAJ&view_op=list_works&sortby=pubdate
    image_url: https://media.springernature.com/m312/springer-static/image/chp%3A10.1007%2F978-3-030-55092-9_15/MediaObjects/492893_1_En_15_Fig1_HTML.png?as=webp
    
  - name: GeoAI & Agentic AI
    description: LLM agents that reason about space, and testing how well LLMs understand spatial concepts
    web_url: https://scholar.google.com/citations?user=QNGs_a4AAAAJ&hl=en
    image_url: /assets/img/geoai.svg

  - name: 3D Reconstruction
    description: Triangle Splatting+ from drone imagery, served as 3D Tiles
    image_url: /assets/img/splatting.svg

# Source for the github.com/am2222 profile README; synced by .github/workflows/sync-profile-readme.yml
exclude:
  - profile/
  - Gemfile
  - Gemfile.lock
  - vendor/
