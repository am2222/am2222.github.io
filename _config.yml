layout: sidebar
style: light

plugins:
  - jekyll-octicons
  - jekyll-github-metadata
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

projects:
  # Curated groups shown on the home page. Stars, language and the default
  # description come live from the GitHub API; `description` overrides it.
  groups:
    - name: Discrete Global Grid Systems
      repos:
        - name: webDggrid
        - name: duckdb-dggs
    - name: DuckDB extensions
      repos:
        - name: duck_geoarrow
        - name: duckrouting
    - name: Web mapping & geo backends
      repos:
        - name: mapbox-pmtiles
        - name: maplibre-landmarks
        - name: express-ogc-api
        - name: strapi-plugin-postgis
    - name: Research
      repos:
        - name: DSTree
        - name: AGILECA
        - name: dygeoprivacyp2p
          description: Dynamic geoprivacy model based on DGGS in P2P environments
        - name: pydggrid


social_media:
