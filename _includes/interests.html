<section id="interests">
  <h2 class="gh-section-title">Interests</h2>
  <ol class="gh-grid">
    {% for topic in site.topics %}
      <li>
        <div class="gh-card gh-topic">
          {% if topic.image_url %}<img src="{{ topic.image_url }}" alt="" width="40" height="40">{% endif %}
          <div>
            {% if topic.web_url %}<a href="{{ topic.web_url }}" class="gh-repo-name">{{ topic.name }}</a>{% else %}<span class="gh-repo-name">{{ topic.name }}</span>{% endif %}
            {% if topic.description %}<p class="gh-card-desc">{{ topic.description }}</p>{% endif %}
          </div>
        </div>
      </li>
    {% endfor %}
  </ol>
</section>
