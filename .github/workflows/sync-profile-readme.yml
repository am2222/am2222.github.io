# Builds the github.com/am2222 profile README (pinned-style repo cards) with
# profile/make_profile.py and pushes it to the am2222/am2222 repo.
# Runs when the project list changes, daily to refresh star counts, or by hand.
# Needs a PROFILE_REPO_TOKEN secret: a fine-grained token with Contents
# read/write on am2222/am2222 only.
name: Sync profile README

on:
  push:
    branches: [master]
    paths: [_config.yml, _data/colors.json, profile/**]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # for the keepalive step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: am2222/am2222
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo
      - name: Build README and cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet pyyaml
          rm -rf profile-repo/cards
          python3 profile/make_profile.py profile-repo
      - name: Push if changed
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update profile README from am2222.github.io@${GITHUB_SHA::7}"
          git push
      # GitHub disables scheduled workflows after 60 days without commits to
      # this repo. Re-enabling through the API resets that timer, no commit needed.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-profile-readme.yml/enable"
